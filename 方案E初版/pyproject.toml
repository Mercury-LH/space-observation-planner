[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-observation-planner"
version = "0.1.0"
description = "Reproducible ground-station observation planning baselines"
requires-python = ">=3.9"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
  "sgp4==2.25",
  "ortools==9.11.4210",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "skyfield==1.53"]

[project.scripts]
space-plan = "space_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
